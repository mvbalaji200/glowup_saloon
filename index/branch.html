<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlowUP Saloons</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="m-0 p-0 bg-stone-50 text-stone-800">

    <div class="relative isolate flex min-h-screen w-full flex-col overflow-hidden">
      <div
        aria-hidden="true"
        class="absolute inset-0 z-0 scale-105 bg-cover bg-center blur-sm"
        style="background-image: url('https://images.unsplash.com/photo-1570613856979-5b4ee86535a1?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDI5fHx8ZW58MHx8fHx8');"
      ></div>
      <div aria-hidden="true" class="absolute inset-0 z-0 bg-black/35"></div>
    <nav class="relative z-10 flex items-center justify-between px-6 py-6 sm:px-12 text-white bg-black/30 backdrop-blur-xs">
        <a href="index.html" aria-label="GlowUP home" class="inline-flex items-center">
          <img src="scissor-svgrepo-com (1).svg" alt="GlowUP" class="size-10" />
        </a>
        <div class="flex items-center gap-6 text-sm font-medium">
          <a href="form.html" class="hover:underline">Enquire</a>
          <a href="search.html" class="hover:underline">Products</a>
        <a href="search.html" aria-label="Search" class="p-1 hover:opacity-80">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35m0 0a7.5 7.5 0 1 0-10.607-10.607 7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
        </a>
        </div>
      </nav>
      <main class="relative z-10 flex flex-1 items-center justify-center px-4 py-10">
        <section class="w-full max-w-6xl rounded-lg border border-white/50 bg-white/60 p-6 backdrop-blur-sm sm:p-8">
          <div class="grid items-stretch gap-6 lg:grid-cols-[minmax(0,1fr)_16rem]">
            <div>
              <h1 class="mb-5 text-2xl font-bold">Our Branches</h1>
              <div id="branch-container" class="grid grid-cols-1 sm:grid-cols-2"></div>
            </div>
            <aside class="flex flex-col justify-center">
              <h2 class="mb-3 text-sm font-semibold">Branch Map</h2>
              <div
                id="map-placeholder"
                class="flex h-48 items-center justify-center rounded border border-stone-300 bg-stone-100 text-sm text-stone-500"
                role="region"
                aria-label="Map placeholder"
              >
                Map
              </div>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <footer class="border-t border-stone-200 bg-white px-4 py-8 text-sm text-stone-600">
      <div class="mx-auto max-w-5xl">
        <h2 class="mb-2 font-semibold text-stone-800">Contact GlowUP</h2>
        <p>Ready to book? <a href="form.html" class="underline">Send us an enquiry</a> or <a href="branch.html" class="underline">find a branch</a>.</p>
        <p class="mt-2"><a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" class="underline">Instagram</a></p>
        <p class="mt-4 text-xs">© 2026 GlowUP Saloons. All rights reserved.</p>
      </div>
    </footer>

    <script src="branch.js"></script>
  </body>
</html>
