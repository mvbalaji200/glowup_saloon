<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlowUP Saloons</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="m-0 p-0 bg-stone-50 text-stone-800">
    <div 
      class="min-h-screen w-full bg-cover bg-center flex flex-col justify-between"
      style="background-image: url('https://images.unsplash.com/photo-1570613856979-5b4ee86535a1?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDI5fHx8ZW58MHx8fHx8');"
    >
      <nav class="flex items-center justify-between px-6 py-6 sm:px-12 text-white bg-black/30 backdrop-blur-xs">
        <a href="#" class="text-2xl font-bold tracking-tight">GlowUP</a>
        <div class="flex items-center gap-6 text-sm font-medium">
          <a href="index.html" class="hover:underline">Services</a>
          <a href="branch.html" class="hover:underline">Locate Us</a>
          <a href="form.html" class="hover:underline">Enquire</a>
          <a href="search.html" class="hover:underline">Products</a>
          <a href="search.html" aria-label="Search" class="p-1 hover:opacity-80">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35m0 0a7.5 7.5 0 1 0-10.607-10.607 7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
          </a>
        </div>
      </nav>
      <div></div>
    </div>
    <main class="mx-auto max-w-5xl space-y-4 px-4 py-8">
      <h1 class="text-2xl font-bold">Products</h1>
      <div class="flex flex-col gap-2 sm:flex-row">
        <input
          type="text" 
          id="search-box" 
          placeholder="Search..." 
          aria-label="Search products and services"
          class="border border-stone-300 p-2 text-sm w-full bg-white"
        />
        <select id="cat-select" aria-label="Filter by category" class="border border-stone-300 p-2 text-sm bg-white">
          <option value="">All Categories</option>
        </select>
      </div>
      <div id="item-list" class="grid grid-cols-1 gap-3 sm:grid-cols-2"></div>
    </main>
    <footer class="border-t border-stone-200 py-6 text-center text-xs text-stone-500">
      <p>© 2026 GlowUP Saloons. All rights reserved.</p>
    </footer>

    <script src="search.js"></script>
  </body>
</html>
