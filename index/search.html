<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlowUP Saloons</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="m-0 bg-stone-50 text-stone-800">
    <section class="relative isolate min-h-[440px] overflow-hidden text-white">
      <div aria-hidden="true" class="absolute inset-0 z-0 scale-105 bg-cover bg-center blur-sm"
      style="background-image: url('https://images.unsplash.com/photo-1570613856979-5b4ee86535a1?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDI5fHx8ZW58MHx8fHx8');"
      ></div>
      <div aria-hidden="true" class="absolute inset-0 z-0 bg-black/35"></div>
      <nav class="relative z-10 flex items-center justify-between bg-black/30 px-6 py-6 backdrop-blur-xs sm:px-12">
        <a href="index.html" aria-label="GlowUP home" class="inline-flex items-center">
          <img src="scissor-svgrepo-com (1).svg" alt="GlowUP" class="size-10" />
        </a>
        <div class="flex items-center gap-6 text-sm font-medium">
          <a href="index.html" class="hover:underline">Services</a>
          <a href="branch.html" class="hover:underline">Locate Us</a>
          <a href="form.html" class="hover:underline">Enquire</a>
          <a href="search.html" class="hover:underline">Products</a>
          <a href="search.html" aria-label="Search" class="p-1 hover:opacity-80">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35m0 0a7.5 7.5 0 1 0-10.607-10.607 7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
          </a>
        </div>
      </nav>
      <div class="relative z-10 mx-auto w-full max-w-5xl px-4 py-14 sm:py-16">
        <div class="rounded-lg border border-white/50 bg-white/60 p-6 text-stone-800 backdrop-blur-sm sm:p-8">
          <h1 class="mb-5 text-3xl font-bold tracking-tight sm:text-4xl">Search</h1>
          <div class="flex flex-col gap-3 sm:flex-row">
            <input
              type="text"
              id="search-box"
              placeholder="Search products and services..."
              aria-label="Search products and services"
              class="w-full rounded-lg border border-white/60 bg-white px-4 py-3 text-sm text-stone-800 placeholder:text-stone-500"
            />
            <select id="cat-select" aria-label="Filter by category" class="w-full rounded-lg border border-white/60 bg-white px-4 py-3 text-sm text-stone-800 sm:w-auto">
              <option value="">All Categories</option>
            </select>
          </div>
        </div>
      </div>
    </section>
    <main class="mx-auto max-w-5xl space-y-4 px-4 py-8">
      <h2 class="text-2xl font-bold">Products</h2>
      <div id="item-list" class="grid grid-cols-1 gap-3 sm:grid-cols-2"></div>
    </main>
    <footer class="border-t border-stone-200 py-6 text-center text-xs text-stone-500">
      <p>© 2026 GlowUP Saloons. All rights reserved.</p>
    </footer>

    <script src="search.js"></script>
  </body>
</html>
